<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ToDo List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>📝 ToDo List</h1>

    <div class="input-section">
      <input type="text" id="taskInput" placeholder="Nouvelle tâche..." />
      <button id="addBtn">Ajouter</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">Toutes</button>
      <button class="filter-btn" data-filter="active">En cours</button>
      <button class="filter-btn" data-filter="done">Terminées</button>
    </div>

    <ul id="taskList"></ul>

    <div class="footer">
      <span id="taskCount">0 tâche(s) restante(s)</span>
      <button id="clearDone">Supprimer terminées</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
